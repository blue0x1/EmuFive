# A PlayStation controller's touchpad and motion sensors are not a mouse: X leaves them alone,
# so no cursor moves when you swipe it. Games and the home screen read the whole controller,
# touchpad button included, themselves (70-ps5-controllers.rules gives them access).
Section "InputClass"
    Identifier "PlayStation controller touchpad: not a mouse"
    MatchProduct "Wireless Controller Touchpad"
    Option "Ignore" "on"
EndSection

Section "InputClass"
    Identifier "PlayStation controller motion sensors: not a mouse"
    MatchProduct "Wireless Controller Motion Sensors"
    Option "Ignore" "on"
EndSection
