# PS5 on PS4 settings.

# Empty (normal): the home screen lists the games (the PS5 folder of the USB
# drive, /user/home/PS5 on the PS4 drive, and a PC's shared folder set in its
# Settings), and you pick one with the controller.
# A game folder (with eboot.bin), an ELF file or a .zar dump: run only that
# one, straight away, without the home screen.
PS5_GAME=

# Extra KytyPS5 options, for example "--perf-overlay" (kyty_emulator --help).
PS5_KYTY_OPTIONS=

# Only with PS5_GAME set: turn the PS4 off when the game quits ("yes"), or
# start it again ("no"). With the home screen, a game that quits goes back to
# the home screen.
PS5_POWEROFF_ON_EXIT=yes
