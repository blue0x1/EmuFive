# PS5 on PS4 settings.

# The game to run: a folder with eboot.bin, an ELF file, or a .zar dump.
# Empty: the first game found in the PS5 folder of the USB drive.
PS5_GAME=

# Extra KytyPS5 options, for example "--perf-overlay" (kyty_emulator --help).
PS5_KYTY_OPTIONS=

# Turn the PS4 off when the emulator exits, so the next start is the PS4 system.
# "no" returns to a text login on tty1 instead.
PS5_POWEROFF_ON_EXIT=yes
