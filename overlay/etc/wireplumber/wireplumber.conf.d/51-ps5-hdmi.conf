# Sound goes to the TV (HDMI). A DualShock 4 on a USB cable has its own sound
# card (its headphone jack), and PipeWire would otherwise prefer it, so the
# game's sound went to the controller. New outputs start at full volume; the
# TV sets the level.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
    actions = { update-props = { priority.session = 2000, priority.driver = 2000 } }
  }
  {
    matches = [ { node.name = "~alsa_output.usb-Sony_Interactive_Entertainment.*" } ]
    actions = { update-props = { priority.session = 100, priority.driver = 100 } }
  }
]

wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
}
