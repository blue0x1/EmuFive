# Log the PS5 user in on tty1; its ~/.bash_profile starts the PS5 session. Quietly: no banner,
# no login line (and ~/.hushlogin hides the login messages).
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin ps5 --skip-login --noissue --nohostname %I $TERM
